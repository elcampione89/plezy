# Builds the panel's Docker image: ghcr.io/<you>/plezy-panel:latest
name: Private panel image

on:
  push:
    branches: [main]
    paths: ["panel/**", ".github/workflows/private-panel-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/plezy-panel" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: panel
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
